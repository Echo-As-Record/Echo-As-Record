[project]
name = "echo-as-record"
version = "0.0.0"
description = "Ear (Echo As Record) monorepo root: shared tooling, contracts and checks"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ear-adapter",
    "ear-baselines",
    "ear-extraction",
    "ear-contracts",
    "ear-storage-client",
    "jsonschema[format-nongpl]>=4.23",
    "pre-commit>=4",
    "pyright>=1.1.400",
    "pytest>=8",
    "ruff>=0.17",
]

[tool.uv]
# 仓库根只放公共工具链，本身不是可安装的包。
package = false

[tool.uv.workspace]
# 新建模块包时加到这里。
members = [
    "libs/ear_contracts",
    "libs/ear_storage_client",
    "services/adapters",
    "services/extraction",
    "experiments/codex_baselines",
]

[tool.uv.sources]
ear-adapter = { workspace = true }
ear-baselines = { workspace = true }
ear-extraction = { workspace = true }
ear-contracts = { workspace = true }
ear-storage-client = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "ai-docs"]

[tool.ruff.lint]
# 中文注释和字符串使用全角标点
ignore = ["RUF001", "RUF002", "RUF003"]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
# Private experiment data can contain downloaded Python environments; never type-check it.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "experiments/codex_baselines/local-data"]
venvPath = "."
venv = ".venv"
extraPaths = ["tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["tools", "tests", "libs", "services/adapters", "services/extraction", "experiments/codex_baselines"]

[tool.pytest.ini_options]
# Also applies when pytest is started inside the experiment directory.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "local-data"]
testpaths = [
    "tests",
    "libs",
    "services/adapters/tests",
    "services/extraction/tests",
    "experiments/codex_baselines/tests",
]
addopts = ["--import-mode=importlib"]
