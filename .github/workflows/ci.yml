name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest

      - name: 文档审定检查
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python tools/check_docs.py --base "origin/${{ github.base_ref }}"
          else
            uv run python tools/check_docs.py
          fi
