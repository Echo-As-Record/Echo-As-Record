name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Plugin management UI tests
        run: node --test services/api/tests/ui/core.test.js services/api/tests/ui/page.test.js

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Prepare isolated PostgreSQL test image
        run: docker pull postgres:17-alpine

      - name: Prepare isolated NATS test image
        run: timeout 90 docker pull nats:2.11-alpine

      - name: Prepare isolated backup roundtrip images
        env:
          EAR_TEST_BACKUP_IMAGE: ear-storage:ci-${{ github.sha }}
        run: |
          docker compose version
          docker pull python:3.12-alpine
          docker build -f deploy/Dockerfile -t "$EAR_TEST_BACKUP_IMAGE" .

      - name: Prepare isolated API and gateway images
        run: |
          docker build -f deploy/Dockerfile.api -t "ear-api:ci-${{ github.sha }}" .
          docker build -f deploy/Dockerfile.gateway -t "ear-gateway:ci-${{ github.sha }}" .

      - name: Tests (including real PostgreSQL, NATS, backup and API-gateway containers)
        env:
          EAR_RUN_POSTGRES_TESTS: "1"
          EAR_RUN_NATS_TESTS: "1"
          EAR_RUN_BACKUP_TESTS: "1"
          EAR_RUN_API_GATEWAY_DEPLOY_TESTS: "1"
          EAR_STORAGE_TEST_IMAGE: ear-storage:ci-${{ github.sha }}
          EAR_API_TEST_IMAGE: ear-api:ci-${{ github.sha }}
          EAR_GATEWAY_TEST_IMAGE: ear-gateway:ci-${{ github.sha }}
          EAR_TEST_BACKUP_IMAGE: ear-storage:ci-${{ github.sha }}
        run: uv run pytest -q

      - name: 文档结构与链接检查
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run python tools/check_docs.py --base "origin/${{ github.base_ref }}"
          else
            uv run python tools/check_docs.py
          fi
