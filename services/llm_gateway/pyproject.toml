[project]
name = "ear-llm-gateway"
version = "0.1.0"
description = "Authenticated model gateway with durable call fencing and storage audit"
requires-python = ">=3.12"
dependencies = ["ear-contracts", "ear-storage-client", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1"]

[project.scripts]
ear-llm-gateway = "ear_llm_gateway.cli:main"

[tool.uv.sources]
ear-contracts = { workspace = true }
ear-storage-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "../.."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests"]
