<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Ear · 活动与笔记</title>
  <link rel="stylesheet" href="/results/results.css">
  <script src="/workspace/workspace.js" data-library-only defer></script>
  <script src="/results/katex.min.js" integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" defer></script>
  <script src="/results/results.js" defer></script>
</head>
<body>
  <a href="#main" class="skip">跳到活动与笔记</a>
  <main id="main" tabindex="-1">
    <h1 class="sr-only">活动与笔记</h1>
    <section id="connection" class="connection" aria-label="连接 Ear">
      <p id="connection-status" role="status">正在连接 Ear…</p>
      <form id="connect-form" hidden autocomplete="off">
        <label for="token">API 令牌</label>
        <input id="token" type="password" maxlength="43" autocomplete="off" spellcheck="false" required>
        <button type="submit">连接</button>
      </form>
      <button id="reconnect" type="button" hidden>重新连接</button>
    </section>
    <section class="board" id="board" aria-label="结果浏览" hidden>
      <nav class="icon-rail" aria-label="界面导航">
        <button id="sidebar-toggle" class="rail-icon" type="button" aria-controls="week-sidebar" aria-expanded="true" aria-label="隐藏侧边栏" title="隐藏侧边栏">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M6 8h.2M6 11h.2"/>
          </svg>
        </button>
        <a id="results-view" class="rail-icon" href="/results/" aria-controls="week-sidebar" aria-current="page" aria-label="活动与笔记" title="活动与笔记">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16M8 14h8m-8 3h5"/>
          </svg>
        </a>
        <a id="timeline-view" class="rail-icon" href="/results/?view=timeline" aria-controls="week-sidebar" aria-label="时间线" title="时间线">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 7.5v9m6-10h8m-8 5.5h6m-6 5.5h8"/><circle cx="6" cy="5.5" r="2"/><circle cx="6" cy="18.5" r="2"/>
          </svg>
        </a>
      </nav>
      <div class="sidebar-slot">
        <aside id="week-sidebar" class="list-panel" aria-labelledby="list-title">
          <div class="list-head">
            <h2 id="list-title">活动与笔记</h2>
            <nav class="week-controls" aria-label="切换周">
              <button id="previous" type="button">‹ 上一周</button>
              <button id="next" type="button">下一周 ›</button>
            </nav>
          </div>
          <div id="source-filters" class="source-filters" hidden>
            <label for="source-filter">渠道来源</label>
            <select id="source-filter">
              <option value="all">全部来源</option>
              <option value="legacy-ear">旧 Ear 导入</option>
              <option id="librechat-filter" value="librechat">LibreChat</option>
            </select>
          </div>
          <div id="week-pages" class="week-pages">
            <div id="list" class="days"></div>
          </div>
          <footer class="list-footer">
            <a href="/workspace/">高级查看 <span aria-hidden="true">↗</span></a>
            <a id="recording-upload-link" href="/recording-upload/" hidden>上传录音 <span aria-hidden="true">↗</span></a>
          </footer>
        </aside>
      </div>
      <section id="reader-pane" class="reader-pane" aria-label="活动阅读区">
        <div id="reader" class="reader" role="region" aria-labelledby="reading-date" tabindex="0">
          <div class="feed">
            <h2 id="reading-date" class="reading-date"></h2>
            <div id="day-coverage" class="day-coverage"></div>
            <div id="day-content"></div>
          </div>
        </div>
      </section>
    </section>
    <noscript><p class="connection">启用 JavaScript 后即可浏览活动和笔记。页面不加载外部资源。</p></noscript>
  </main>
</body>
</html>
