[project]
name = "ear-api"
version = "0.1.0"
description = "Authenticated feedback and read-only user gateway"
requires-python = ">=3.12"
dependencies = ["ear-contracts", "ear-storage-client", "ear-storage", "ear-extraction", "fastapi>=0.115", "httpx>=0.28", "uvicorn>=0.34"]

[project.scripts]
ear-api = "ear_api.cli:main"

[tool.uv.sources]
ear-contracts = { workspace = true }
ear-storage-client = { workspace = true }
ear-storage = { workspace = true }
ear-extraction = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "../.."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["src"]
include = ["src", "tests"]
